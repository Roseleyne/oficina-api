spring.application.name=oficina-api

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/oficina}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==============================
# JWT
# ==============================

# 1 hora em milissegundos
jwt.expiration=3600000

# Chave local do MVP
# Em produção deve ser fornecida via variável de ambiente
jwt.secret=${JWT_SECRET:M2RhIyaNLkUF4z3aldc7pJ43TBFb3V7ZEnT6Eex6b5A=}

# ==============================
# ADMIN INICIAL
# ==============================

app.admin.email=${ADMIN_EMAIL:admin@oficina.com}
app.admin.password=${ADMIN_PASSWORD:Admin@123}

# ==============================
# OPENAPI / SWAGGER
# ==============================

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha


# ==============================
# WEBHOOK (aprovacao de orcamento)
# Em producao/K8s o valor vem do Secret (WEBHOOK_TOKEN)
# ==============================
webhook.token=${WEBHOOK_TOKEN:dev-webhook-token}

# ==============================
# ACTUATOR / HEALTH (Kubernetes probes)
# ==============================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true